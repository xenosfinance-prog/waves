# XenosFinance — IndexNow (2026-11-14): segnala a Bing & co. le pagine nuove o aggiornate.
# Ogni 2 ore guarda i commit recenti (anche quelli dei bot, che non avviano altri workflow).
# Avvio manuale con "all" = invio di tutte le pagine principali (primo invio).
name: IndexNow

on:
  schedule:
    - cron: "37 */2 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Invia tutte le pagine (true/false)"
        required: false
        default: "false"

permissions:
  contents: read
  actions: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 200
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 2026-11-25: GitHub esegue il cron "ogni 2 ore" solo 2-3 volte al giorno, quindi la finestra fissa
      # di 2h15m perdeva quasi tutte le pagine (Bing: "pages not submitted via IndexNow"). Ora la finestra
      # parte dall'ultimo invio riuscito (−15 min di margine), massimo 3 giorni.
      - name: Submit to IndexNow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.inputs.all }}" = "true" ]; then
            python tools/indexnow.py --all
          else
            last=$(gh run list -R "${{ github.repository }}" --workflow indexnow.yml --status success -L 1 \
                     --json createdAt -q '.[0].createdAt' 2>/dev/null || true)
            if [ -n "$last" ]; then
              since=$(date -u -d "$last - 15 minutes" '+%Y-%m-%dT%H:%M:%SZ')
              floor=$(date -u -d '3 days ago' '+%Y-%m-%dT%H:%M:%SZ')
              [ "$since" \< "$floor" ] && since="$floor"
            else
              since=$(date -u -d '26 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
            fi
            echo "Changes since $since"
            python tools/indexnow.py --since "$since"
          fi
