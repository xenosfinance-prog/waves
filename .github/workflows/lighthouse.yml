name: Lighthouse audit
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL da analizzare
        default: https://xenosfinance.com/
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lighthouse mobile + desktop
        run: |
          npx -y lighthouse@12 "${{ inputs.url }}" --quiet --chrome-flags="--headless=new --no-sandbox" \
            --output=json --output-path=mobile.json || true
          npx -y lighthouse@12 "${{ inputs.url }}" --quiet --preset=desktop --chrome-flags="--headless=new --no-sandbox" \
            --output=json --output-path=desktop.json || true
      - name: Pubblica il report sul branch lighthouse-report
        run: |
          mkdir out && mv mobile.json desktop.json out/ 2>/dev/null || true
          cd out && git init -q && git checkout -q -b lighthouse-report
          git config user.name "lighthouse-bot" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Lighthouse report $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" lighthouse-report
