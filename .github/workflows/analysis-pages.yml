# XenosFinance — pagine /analysis (SEO), rigenerate sei volte al giorno (sessioni EU e USA).
# Richiede il secret del repository ANTHROPIC_API_KEY
# (Settings → Secrets and variables → Actions → New repository secret).
name: Daily analysis pages

on:
  schedule:
    - cron: "20 5 * * *"    # 05:20 UTC — prima dell'apertura europea
    - cron: "20 12 * * *"   # 12:20 UTC — prima dell'apertura USA
  workflow_dispatch: {}      # avvio manuale da Actions → "Run workflow"

permissions:
  contents: write
  models: read      # 2026-11-26: GitHub Models gratuito come riserva di Gemini

concurrency:
  group: analysis-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      # 2026-10-28: sei edizioni al giorno avviate dal bot Telegram all'orario esatto
      # (ora italiana 06:20 · 09:20 · 12:20 · 15:50 · 18:20 · 21:20, lun–ven; nel weekend
      # solo le 06:20). Il cron qui sopra resta come riserva: se le pagine sono già state
      # rigenerate da meno di 150 minuti si ferma (niente doppie generazioni).
      - name: Skip late scheduled run if pages are fresh
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct -- analysis/index.html || echo 0)
          now=$(date -u +%s)
          echo "last build: $(date -u -d @${last:-0})"
          if [ $(( now - ${last:-0} )) -lt 9000 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.skip != '1'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.fresh.outputs.skip != '1'
        run: pip install -r requirements.txt

      - name: Generate pages
        if: steps.fresh.outputs.skip != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 2026-10-25: traduzione IT gratuita
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/gen_analysis_pages.py

      - name: Commit and push
        if: steps.fresh.outputs.skip != '1'
        run: |
          git config user.name  "xenos-analysis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add analysis sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Analysis pages $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Altri processi automatici scrivono sul repo (brief, trades):
          # riallinea e riprova in caso di push concorrente.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
