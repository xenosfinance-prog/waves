# XenosFinance — pagine /analysis (SEO), rigenerate due volte al giorno.
# Richiede il secret del repository ANTHROPIC_API_KEY
# (Settings → Secrets and variables → Actions → New repository secret).
name: Daily analysis pages

on:
  schedule:
    - cron: "20 5 * * *"    # 05:20 UTC — prima dell'apertura europea
    - cron: "20 12 * * *"   # 12:20 UTC — prima dell'apertura USA
  workflow_dispatch: {}      # avvio manuale da Actions → "Run workflow"

permissions:
  contents: write

concurrency:
  group: analysis-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      # 2026-10-13: il bot Telegram avvia questo workflow all'orario esatto
      # (05:20 / 12:20 UTC). Il cron qui sotto resta come riserva: se parte in
      # ritardo e le pagine sono già state aggiornate da meno di 4 ore, si ferma
      # (niente doppia generazione né doppie chiamate API).
      # 2026-10-22: il cron di GitHub parte anche 5 ore in ritardo (10:08, 17:18):
      # con la vecchia soglia "meno di 4 ore" la riserva rigenerava comunque le
      # pagine → 4 generazioni al giorno invece di 2 (costo API doppio). Ora salta
      # se le pagine sono già state create dopo l'orario dell'edizione corrente
      # (05:20 o 12:20 UTC, la più recente già passata).
      - name: Skip late scheduled run if this edition is already built
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct -- analysis/index.html || echo 0)
          now=$(date -u +%s)
          slot=$(date -u -d "$(date -u +%F) 12:20" +%s)
          if [ "$now" -lt "$slot" ]; then slot=$(date -u -d "$(date -u +%F) 05:20" +%s); fi
          if [ "$now" -lt "$slot" ]; then slot=$(( slot - 86400 + 25200 )); fi   # prima delle 05:20: edizione 12:20 di ieri
          echo "last build: $(date -u -d @${last:-0}) | edition slot: $(date -u -d @$slot)"
          if [ "${last:-0}" -ge "$slot" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.skip != '1'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.fresh.outputs.skip != '1'
        run: pip install -r requirements.txt

      - name: Generate pages
        if: steps.fresh.outputs.skip != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/gen_analysis_pages.py

      - name: Commit and push
        if: steps.fresh.outputs.skip != '1'
        run: |
          git config user.name  "xenos-analysis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add analysis sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Analysis pages $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Altri processi automatici scrivono sul repo (brief, trades):
          # riallinea e riprova in caso di push concorrente.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
