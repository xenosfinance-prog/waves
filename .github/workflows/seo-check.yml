name: SEO redirect check
on:
  push:
    branches: [seo-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q requests
      - run: python tools/www_probe.py
      - run: |
          git config user.name "seo-check"; git config user.email "seo-check@users.noreply.github.com"
          git add -f seo_out && git commit -qm "seo check output [skip ci]" && git push
