name: CME probe (temporary)
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install yfinance
      - name: Probe Yahoo futures contracts
        shell: python
        run: |
          import yfinance as yf, datetime as dt
          codes = "FGHJKMNQUVXZ"
          now = dt.date.today()
          syms = []
          for root, ex in (("CL","NYM"),("NG","NYM"),("BZ","NYM"),("GC","CMX")):
              y, m = now.year, now.month
              for i in range(7):
                  mm = (m + i - 1) % 12 + 1; yy = y + (m + i - 1) // 12
                  syms.append(f"{root}{codes[mm-1]}{str(yy)[2:]}.{ex}")
          for s in syms:
              try:
                  t = yf.Ticker(s)
                  h = t.history(period="5d", interval="1d")
                  fi = {}
                  try:
                      inf = t.info
                      fi = {k: inf.get(k) for k in ("openInterest","volume","expireDate","regularMarketPrice")}
                  except Exception as e:
                      fi = {"info_err": str(e)[:60]}
                  last = h.tail(1)
                  msg = f"rows={len(h)} close={float(last['Close'].iloc[0]) if len(h) else None} vol={int(last['Volume'].iloc[0]) if len(h) else None} {fi}"
              except Exception as e:
                  msg = f"ERR {str(e)[:120]}"
              print(f"::notice title={s}::{msg}")
