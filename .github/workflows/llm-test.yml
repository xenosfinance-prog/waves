name: llm-test (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -c "
          import free_llm as f
          print('PLAIN:', f.openai_compat('In one sentence: what drives gold prices?', max_tokens=80))
          print('JSON:', f.openai_compat('Return JSON {\"bias\": \"bullish|bearish|neutral\", \"note\": short text} for gold.', max_tokens=120, json_mode=True))
          print('GENERATE (no Gemini key):', f.generate('Say OK in one word.', max_tokens=10))
          print('ERR:', f.LAST_ERRORS)"
