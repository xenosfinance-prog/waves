# 2026-10-30: audit del motore Elliott su dati reali. Gira sui push al branch
# "ew-audit" (mai in produzione: Railway e le pagine usano solo main) e a mano
# da Actions. Confronta la versione di main con quella del branch.
name: EW engine audit

on:
  push:
    branches: [ew-audit]
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Audit (v0 = main, v1 = this branch)
        run: |
          git show origin/main:ew_server.py > tools/_ew_main.py
          python tools/ew_audit.py tools/_ew_main.py ew_server.py
