# 2026-10-30: audit del motore Elliott su dati reali. Gira sui push al branch
# "ew-audit" (mai in produzione: Railway e le pagine usano solo main) e a mano
# da Actions. Confronta la versione di main con quella del branch.
name: EW engine audit

on:
  push:
    branches: [ew-audit]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Audit (v0 = main, v1 = this branch)
        run: |
          git show origin/main:ew_server.py > tools/_ew_main.py
          set +e
          python tools/ew_audit.py tools/_ew_main.py ew_server.py > tools/ew_audit_report.txt 2>&1
          echo "exit=$?" >> tools/ew_audit_report.txt
          rm -f tools/_ew_main.py
          pip install pytz >/dev/null 2>&1
          python tools/bot_ew_audit.py WMT > tools/bot_ew_audit_report.txt 2>&1
          echo "exit=$?" >> tools/bot_ew_audit_report.txt
      # report sul branch di audit (push con GITHUB_TOKEN: non rilancia il workflow)
      - name: Save report
        if: github.ref == 'refs/heads/ew-audit'
        run: |
          git config user.name "xenos-audit-bot"
          git config user.email "xenosfinance@gmail.com"
          git add tools/ew_audit_report.txt tools/bot_ew_audit_report.txt
          git commit -m "EW audit report" && git push origin HEAD:ew-audit
