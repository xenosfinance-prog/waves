# One-off (2026-10-21): Market Brief del mattino pubblicato da Actions perché
# Railway aveva build/deploy in pausa. Parte al push di questo file; da eliminare.
# run 3: GITHUB_PATH riservata da Actions → forzata nello script.
name: Market brief (one-off)

on:
  push:
    branches: [main]
    paths: [".github/workflows/market-brief-once.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install feedparser google-genai tzdata
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: xenosfinance-prog/waves
          GITHUB_PATH: market-brief.html
          GITHUB_BRANCH: main
        run: |
          set -o pipefail
          python tools/brief_once/run_once.py 2>&1 | tee tools/brief_once/last_run.log
      - name: Save run log (debug)
        if: always()
        run: |
          git config user.name  "xenos-analysis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f tools/brief_once/last_run.log
          git commit -m "brief one-off: run log" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
