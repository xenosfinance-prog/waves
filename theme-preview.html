<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theme preview — XenosFinance</title>
</head>
<body>
<!-- Pagina temporanea (noindex) per confrontare i temi colore prima di applicarli al sito.
     Scarica la pagina vera (stessa origine), ricolora sfondi/testi/bordi e la mostra al suo posto. -->
<script>
const OPTIONS = {
  A: {label: "1 · Attuale"},
  B: {label: "2 · Scuro più morbido", mode: "soft"},
  C: {label: "3 · Tema chiaro", mode: "light"},
  D: {label: "4 · Solo menu chiaro", mode: "nav"},
};
const q = new URLSearchParams(location.search);
const opt = OPTIONS[q.get("t")] ? q.get("t") : "A";
let page = q.get("p") || "/";
if (!page.startsWith("/") || page.startsWith("//")) page = "/";

const PAGES = [["/", "Home"], ["/dashboard", "Dashboard"], ["/market-brief", "Market Brief"]];
const btn = (href, txt, on) => `<a href="${href}" style="text-decoration:none;border:1px solid ${on ? "#2962ff" : "#1e2a3d"};` +
  `border-radius:4px;padding:5px 9px;color:${on ? "#fff" : "#8ba3c7"};background:${on ? "#2962ff" : "transparent"}">${txt}</a>`;
let bar = '<div id="xf-preview-bar" style="position:fixed;bottom:0;left:0;right:0;z-index:2147483647;display:flex;gap:6px;flex-wrap:wrap;' +
  'align-items:center;padding:8px 10px;background:#0d1421;border-top:1px solid #1e2a3d;font:13px system-ui,sans-serif">' +
  '<b style="color:#e6edf7;margin-right:6px">Tema</b>';
for (const k of Object.keys(OPTIONS)) bar += btn(`?t=${k}&p=${encodeURIComponent(page)}`, OPTIONS[k].label, k === opt);
bar += '<span style="width:14px"></span><b style="color:#e6edf7;margin-right:6px">Pagina</b>';
for (const [p, n] of PAGES) bar += btn(`?t=${opt}&p=${encodeURIComponent(p)}`, n, p === page);
bar += "</div>";

// Ricolorazione: lavora sui colori calcolati (variabili CSS + colori scritti a mano)
const recolor = `(function(){
  var MODE=${JSON.stringify(OPTIONS[opt].mode || "")};
  if(!MODE)return;
  var NAV=MODE==='nav'; if(NAV) MODE='light';
  function parse(c){var m=c&&c.match(/rgba?\\(([^)]+)\\)/);if(!m)return null;var p=m[1].split(',').map(parseFloat);
    if(p.length>3&&p[3]===0)return null;return {r:p[0],g:p[1],b:p[2],a:p.length>3?p[3]:1};}
  function toHsl(c){var r=c.r/255,g=c.g/255,b=c.b/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0;
    if(mx!==mn){var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
      h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6;}return {h:h,s:s,l:l};}
  function hsl(h,s,l,a){function f(n){var k=(n+h*12)%12,x=s*Math.min(l,1-l);return Math.round(255*(l-x*Math.max(-1,Math.min(k-3,9-k,1))));}
    return 'rgba('+f(0)+','+f(8)+','+f(4)+','+a+')';}
  function bg(c){var x=toHsl(c);
    if(MODE==='soft'){ if(x.l<0.3) return hsl(x.h,Math.min(x.s,0.32),x.l*1.25+0.07,c.a); return null;}
    if(x.l<0.32) return hsl(x.h,Math.min(x.s,0.25),0.985-x.l*0.45,c.a);
    if(x.s>0.4&&x.l<0.7) return null;                       /* bottoni/accenti colorati */
    return null;}
  function fg(c,onAccent){var x=toHsl(c);
    if(MODE==='soft'){ if(x.l>0.45&&x.s<0.45) return hsl(x.h,x.s,Math.min(0.97,x.l*1.06+0.05),c.a); return null;}
    if(onAccent) return null;
    if(x.s<0.45&&x.l>0.45) return hsl(x.h,Math.min(x.s,0.35),Math.max(0.12,0.95-x.l*0.95),c.a);   /* testi chiari -> scuri */
    if(x.s>=0.45&&x.l>0.55) return hsl(x.h,x.s,Math.max(0.32,x.l-0.28),c.a);                   /* verdi/rossi/blu più scuri */
    return null;}
  function bd(c){var x=toHsl(c);
    if(MODE==='soft'){ if(x.l<0.4) return hsl(x.h,Math.min(x.s,0.35),x.l*1.35+0.06,c.a); return null;}
    if(x.l<0.4&&x.s<0.6) return hsl(x.h,Math.min(x.s,0.25),0.86,c.a); return null;}
  var done=new WeakSet();
  function scope(){ if(!NAV) return document.querySelectorAll('body *');
    return document.querySelectorAll('.masthead-nav, .masthead-nav *, .nav-dropdown-menu, .nav-dropdown-menu *'); }
  function run(){
    var m=MODE;
    if(!NAV){var b=parse(getComputedStyle(document.body).backgroundColor);
      if(b){var nb=bg(b);if(nb){document.body.style.setProperty('background-color',nb,'important');
        document.documentElement.style.setProperty('background-color',nb,'important');}}}
    scope().forEach(function(el){
      if(done.has(el)||el.closest('#xf-preview-bar'))return;done.add(el);
      var cs=getComputedStyle(el),b=parse(cs.backgroundColor),acc=false;
      if(b){var bx=toHsl(b);acc=bx.s>0.4&&bx.l>0.3&&bx.l<0.7&&b.a>0.5;var nb=bg(b);if(nb)el.style.setProperty('background-color',nb,'important');}
      var c=parse(cs.color);if(c){var nc=fg(c,acc);if(nc)el.style.setProperty('color',nc,'important');}
      ['Top','Right','Bottom','Left'].forEach(function(s){var w=parseFloat(cs['border'+s+'Width']);if(!w)return;
        var k=parse(cs['border'+s+'Color']);if(k){var nk=bd(k);if(nk)el.style.setProperty('border-'+s.toLowerCase()+'-color',nk,'important');}});
      if(cs.backgroundImage&&cs.backgroundImage.indexOf('gradient')>=0&&!NAV){
        var g=cs.backgroundImage.match(/rgba?\([^)]+\)/);var gc=g?parse(g[0]):null;
        el.style.setProperty('background-image','none','important');
        if(gc){var ng=bg(gc);if(ng)el.style.setProperty('background-color',ng,'important');}}
    });
  }
  run();setTimeout(run,1200);setTimeout(run,3500);setInterval(run,5000);
})();`;

fetch(page, {credentials: "same-origin"}).then(r => r.text()).then(html => {
  html = html.replace(/<head([^>]*)>/i, `<head$1><base href="${page}">`);
  html = html.replace(/<\/body>/i, bar + "<scr" + "ipt>" + recolor + "</scr" + "ipt></body>");
  document.open();
  document.write(html);
  document.close();
});
</script>
</body>
</html>
