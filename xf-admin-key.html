<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>XenosFinance — Admin key</title>
<style>
  body{background:#172538;color:#edf2f8;font-family:'IBM Plex Mono',monospace;max-width:560px;margin:60px auto;padding:0 20px;font-size:13px;line-height:1.6}
  h1{font-size:16px;letter-spacing:2px;text-transform:uppercase;color:#f5c542}
  input,button,textarea{width:100%;box-sizing:border-box;font-family:inherit;font-size:13px;padding:10px;margin:6px 0;background:#1e3149;color:#edf2f8;border:1px solid #355281}
  button{background:#1d4ed8;border:none;cursor:pointer;font-weight:600;letter-spacing:1px}
  .muted{color:#9db1c8;font-size:11px}
  .err{color:#f87171}
</style>
</head>
<body>
<h1>Nuova password admin</h1>
<p class="muted">La password resta su questo dispositivo: la pagina calcola solo l'impronta (hash PBKDF2) e non invia niente in rete.
Copia l'impronta e mandala a Claude. Non mandare la password.</p>
<input id="p1" type="password" placeholder="Nuova password (almeno 12 caratteri)" autocomplete="new-password">
<input id="p2" type="password" placeholder="Ripeti la password" autocomplete="new-password">
<button onclick="go()">Calcola impronta</button>
<div id="err" class="err"></div>
<textarea id="out" rows="3" readonly placeholder="L'impronta comparirà qui"></textarea>
<script>
// 2026-11-18 — stessi parametri di /xf-admin.js (sale e iterazioni devono coincidere)
const SALT = '56fb78bf0a82b0a4670b30e94db296be', ITER = 310000;
async function pbkdf2(pw) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode(SALT), iterations: ITER }, k, 256);
  return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function go() {
  const a = document.getElementById('p1').value, b = document.getElementById('p2').value;
  const err = document.getElementById('err'), out = document.getElementById('out');
  err.textContent = ''; out.value = '';
  if (a.length < 12) { err.textContent = 'Usa almeno 12 caratteri (lettere, numeri e simboli).'; return; }
  if (a !== b) { err.textContent = 'Le due password non coincidono.'; return; }
  out.value = 'Calcolo…';
  out.value = await pbkdf2(a);
}
</script>
</body>
</html>
