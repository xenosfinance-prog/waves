<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Font preview — XenosFinance</title>
</head>
<body>
<!-- Pagina temporanea (noindex) per confrontare i font prima di applicarli al sito.
     Scarica la pagina vera (stessa origine), aggiunge il font scelto e la mostra al suo posto. -->
<script>
const OPTIONS = {
  A: {label: "A · Attuale", fam: null},
  B: {label: "B · Inter", fam: "Inter:wght@400;500;600;700;800;900",
      serif: "'Inter',sans-serif", body: "'Inter',sans-serif"},
  C: {label: "C · IBM Plex Sans", fam: "IBM+Plex+Sans:wght@400;500;600;700",
      serif: "'IBM Plex Sans',sans-serif", body: "'IBM Plex Sans',sans-serif"},
  D: {label: "D · Playfair + Inter", fam: "Inter:wght@400;500;600;700",
      serif: null, body: "'Inter',sans-serif"},
  E: {label: "E · Space Grotesk + Inter", fam: "Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600",
      serif: "'Space Grotesk',sans-serif", body: "'Inter',sans-serif"},
};
const q = new URLSearchParams(location.search);
const opt = OPTIONS[q.get("f")] ? q.get("f") : "A";
let page = q.get("p") || "/";
if (!page.startsWith("/") || page.startsWith("//")) page = "/";

let bar = '<div style="position:fixed;bottom:0;left:0;right:0;z-index:2147483647;display:flex;gap:6px;flex-wrap:wrap;' +
  'align-items:center;padding:8px 10px;background:#0d1421;border-top:1px solid #1e2a3d;font:13px system-ui,sans-serif">' +
  '<b style="color:#e6edf7;margin-right:6px">Font preview</b>';
for (const k of Object.keys(OPTIONS)) {
  const on = k === opt;
  bar += `<a href="?f=${k}&p=${encodeURIComponent(page)}" style="text-decoration:none;border:1px solid ${on ? "#2962ff" : "#1e2a3d"};` +
         `border-radius:4px;padding:5px 9px;color:${on ? "#fff" : "#8ba3c7"};background:${on ? "#2962ff" : "transparent"}">${OPTIONS[k].label}</a>`;
}
bar += "</div>";

const o = OPTIONS[opt];
let inject = "";
if (o.fam) {
  inject += `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=${o.fam}&display=swap">`;
  let css = ":root{";
  if (o.serif) css += `--serif:${o.serif};--font-display:${o.serif};`;
  if (o.body) css += `--body:${o.body};--sans:${o.body};`;
  css += "}";
  if (o.serif) css += `h1,h2,h3,.masthead-name{font-family:${o.serif}!important}`;
  inject += `<style>${css}</style>`;
}

fetch(page, {credentials: "same-origin"}).then(r => r.text()).then(html => {
  html = html.replace(/<head([^>]*)>/i, `<head$1><base href="${page}">`);
  html = html.replace(/<\/head>/i, inject + "</head>");
  html = html.replace(/<\/body>/i, bar + "</body>");
  document.open();
  document.write(html);
  document.close();
});
</script>
</body>
</html>
